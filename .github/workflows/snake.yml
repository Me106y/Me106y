name: Generate Snake

# Regenerates the snake animation from Me106y's contribution graph and publishes
# it to the `output` branch, which the profile README embeds:
#   https://raw.githubusercontent.com/Me106y/Me106y/output/snake.svg
#   https://raw.githubusercontent.com/Me106y/Me106y/output/snake-dark.svg

on:
  # refresh the grid once a day (00:30 UTC)
  schedule:
    - cron: "30 0 * * *"
  # allow manual runs from the Actions tab / `gh workflow run`
  workflow_dispatch:
  # regenerate whenever the README or this workflow changes
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
